[project]
name = "demo-ia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GuillaumeWnt", email = "guillaume.winant@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "scipy>=1.18.1",
    "torch",
    "transformers>=5.19.0",
]

[project.scripts]
demo-ia = "demo_ia:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
